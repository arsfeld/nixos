[package]
name = "claude-board-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
claude-board-proto = { path = "../claude-board-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net"] }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures = "0.3"
tokio-tungstenite = "0.26"
