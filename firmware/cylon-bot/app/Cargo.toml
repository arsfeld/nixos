[package]
name = "cylon-bot"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "Firmware for the ESP32-S3 Cylon Bot (Waveshare 1.75 AMOLED)"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
cylon-bot-ui = { path = "../ui" }
cylon-bot-proto = { path = "../../../packages/cylon-bot-proto" }
# The no_std feature set (std pulls in memmap2, which does not build for ESP-IDF); keep it equal to ui's.
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm", "software-renderer-path"] }

[build-dependencies]
embuild = "0.33"

# Local patch, made by ../scripts/vendor-slint-core.sh (run it once after checkout).
[patch.crates-io]
i-slint-core = { path = "../vendor/i-slint-core" }

# After changing anything under [package.metadata.esp-idf-sys], components/ or sdkconfig.defaults run
# `cargo clean -p esp-idf-sys --release`: esp-idf-sys does not notice (`just board build` does it).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.2.0" }

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/board_display"]
bindings_header = "components/board_display/board_display.h"
bindings_module = "board_display"
