<?xml version="1.0" encoding="UTF-8"?>
<!-- The avatar's Centurion head, the source of centurion-280.png (scripts/render-centurion.sh).
     Static: the red eye is drawn over the visor slot by presence.slint, which assumes where it lands.
     The head is drawn at 1:1 and scaled by 0.82 about the visor's centre (140, 134), so the chin clears
     the home screen's summary line; the slot (x 58..222, y 120..148 unscaled) lands at about
     x 73..207, y 123..146. Keep the slot pure black so the eye is the only colour on it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.22" stop-color="#b9c0c9"/>
      <stop offset="0.40" stop-color="#6c747f"/>
      <stop offset="0.47" stop-color="#2c3138"/>
      <stop offset="0.56" stop-color="#7d8590"/>
      <stop offset="0.80" stop-color="#c9ced5"/>
      <stop offset="1" stop-color="#4b525c"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="1" stop-color="#1d2228"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a515b"/>
      <stop offset="0.5" stop-color="#d4d9df"/>
      <stop offset="1" stop-color="#4a515b"/>
    </linearGradient>
  </defs>
  <g transform="translate(140 134) scale(0.82) translate(-140 -134)">

  <!-- Side flanges (the "ears"). -->
  <path d="M40 112 L26 122 L26 176 L44 188 Z" fill="url(#chrome)"/>
  <path d="M240 112 L254 122 L254 176 L236 188 Z" fill="url(#chrome)"/>

  <!-- Helmet: dome, cheeks tapering to the jaw. -->
  <path id="head" d="M40 132 C40 64 84 26 140 26 C196 26 240 64 240 132
           L234 176 L214 246 C200 262 180 270 140 270 C100 270 80 262 66 246 L46 176 Z"
        fill="url(#chrome)"/>
  <path d="M40 132 C40 64 84 26 140 26 C196 26 240 64 240 132
           L234 176 L214 246 C200 262 180 270 140 270 C100 270 80 262 66 246 L46 176 Z"
        fill="url(#side)"/>

  <!-- Centre crest down the dome. -->
  <path d="M134 30 L146 30 L144 108 L136 108 Z" fill="#f4f6f8" opacity="0.55"/>
  <path d="M146 30 L150 31 L147 108 L144 108 Z" fill="#20252b" opacity="0.6"/>

  <!-- Brow: the raised band the visor sits in. -->
  <rect x="48" y="110" width="184" height="48" rx="12" fill="#2a2f36"/>
  <rect x="50" y="112" width="180" height="2" rx="1" fill="#e6eaee" opacity="0.7"/>
  <!-- Visor slot. -->
  <rect x="58" y="120" width="164" height="28" rx="8" fill="#000"/>

  <!-- Cheek plates. -->
  <path d="M58 166 L86 172 L92 236 L74 228 Z" fill="#1b1f25" opacity="0.7"/>
  <path d="M222 166 L194 172 L188 236 L206 228 Z" fill="#1b1f25" opacity="0.7"/>

  <!-- Grille: a recessed mouth with vertical slats. -->
  <path d="M94 174 L186 174 L180 248 C166 256 114 256 100 248 Z" fill="url(#recess)"/>
  <g fill="url(#slat)">
    <rect x="101" y="180" width="5" height="64" rx="2"/>
    <rect x="112" y="180" width="5" height="68" rx="2"/>
    <rect x="123" y="180" width="5" height="70" rx="2"/>
    <rect x="134" y="180" width="5" height="71" rx="2"/>
    <rect x="145" y="180" width="5" height="71" rx="2"/>
    <rect x="156" y="180" width="5" height="70" rx="2"/>
    <rect x="167" y="180" width="5" height="68" rx="2"/>
    <rect x="178" y="180" width="4" height="62" rx="2"/>
  </g>
  </g>
</svg>
