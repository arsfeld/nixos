name: "Build & Cache"

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      flake_lock:
        description: "Base64-encoded flake.lock content"
        required: false
        type: string
      hosts:
        description: "JSON array of host names to build. Empty builds every host in ciMatrix."
        required: false
        type: string
        default: ""

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://attic.arsfeld.dev/system
            extra-trusted-public-keys = system:mUX40QMM+dqZ0wQaHp7sH50UgiZnSXsInzc9/MvaZRc=
            fallback = true
            connect-timeout = 5
            download-attempts = 3

      - name: Override flake.lock
        if: inputs.flake_lock
        run: echo '${{ inputs.flake_lock }}' | base64 -d > flake.lock

      - name: Derive matrix from flake
        id: gen
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          set -euo pipefail
          include=$(nix eval --json '.#ciMatrix')
          if [ -n "${HOSTS}" ]; then
            include=$(printf '%s' "$include" \
              | jq -c --argjson want "$HOSTS" '[.[] | select(.host as $h | $want | index($h))]')
          fi
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker image prune --all --force

      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://attic.arsfeld.dev/system
            extra-trusted-public-keys = system:mUX40QMM+dqZ0wQaHp7sH50UgiZnSXsInzc9/MvaZRc=
            fallback = true
            connect-timeout = 5
            download-attempts = 3

      - name: Override flake.lock
        if: inputs.flake_lock
        run: echo '${{ inputs.flake_lock }}' | base64 -d > flake.lock

      - name: Build and push to cache
        shell: nix develop --command bash -e {0}
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          echo "Building ${{ matrix.host }}..."
          nix build '.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel' \
            -o "result-${{ matrix.host }}"

          echo "Pushing to Attic cache..."
          attic login system https://attic.arsfeld.dev "$ATTIC_TOKEN"
          attic push system "./result-${{ matrix.host }}"

          echo "Done: ${{ matrix.host }} built and cached"
