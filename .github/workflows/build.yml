name: "Build & Cache"

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      flake_lock:
        description: "Base64-encoded flake.lock content"
        required: false
        type: string
      hosts:
        description: "JSON array of host names to build. Empty builds every host in ciMatrix."
        required: false
        type: string
        default: ""

# A called workflow evaluates this with the CALLER's context, so with a group
# keyed only on the ref, a human pushing to master while the Sunday "Weekly
# Update" build is running cancelled it — the commit job was then skipped and
# the update silently dropped for a week. Keying on the workflow and the
# triggering event as well keeps the scheduled build and push builds in
# separate groups under either resolution of github.workflow, while pushes
# still supersede each other as before.
concurrency:
  group: build-cache-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.arsfeld.dev https://attic.arsfeld.dev/system
            extra-trusted-public-keys = cache.arsfeld.dev-1:rf7PgrG/BVE3llOcYdiP0hNqIvOSvIQoz7zoH1kt1d8= system:mUX40QMM+dqZ0wQaHp7sH50UgiZnSXsInzc9/MvaZRc=
            fallback = true
            connect-timeout = 5
            download-attempts = 3

      - name: Override flake.lock
        if: inputs.flake_lock
        run: echo '${{ inputs.flake_lock }}' | base64 -d > flake.lock

      - name: Derive matrix from flake
        id: gen
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          set -euo pipefail

          # Filter INSIDE the Nix expression. `.#ciMatrix` forces `platform` for
          # every discovered host, and that is a full nixosConfigurations
          # evaluation each — so filtering afterwards with jq means a flake.lock
          # that breaks the evaluation of a host we are not even building still
          # fails this job, skips the build, and silently discards the update.
          # That is the 2026-06-07 bug one layer up from where it was fixed.
          # `x.host` is a bare string, so non-selected hosts are never forced.
          if [ -n "${HOSTS}" ]; then
            want=$(printf '%s' "${HOSTS}" | jq -r 'map(@json) | join(" ")')
            include=$(nix eval --json '.#ciMatrix' \
              --apply "l: builtins.filter (x: builtins.elem x.host [ ${want} ]) l")
          else
            include=$(nix eval --json '.#ciMatrix')
          fi

          # A zero-row matrix is not "nothing to do", it is "nothing was built".
          # GitHub skips a matrix job with no rows, `success()` in update.yml
          # then passes, and flake.lock gets committed with zero hosts verified.
          count=$(printf '%s' "$include" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Build matrix is empty (hosts input: '${HOSTS:-<all>}'). Refusing to report success with nothing to build." >&2
            exit 1
          fi
          echo "Matrix has $count host(s)."

          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      # niks3 authenticates CI with a short-lived GitHub OIDC token rather
      # than a long-lived secret. Without this, ACTIONS_ID_TOKEN_REQUEST_URL
      # and ACTIONS_ID_TOKEN_REQUEST_TOKEN are simply absent from the step
      # environment and the token script fails with an unset-variable error.
      id-token: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker image prune --all --force

      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.arsfeld.dev https://attic.arsfeld.dev/system
            extra-trusted-public-keys = cache.arsfeld.dev-1:rf7PgrG/BVE3llOcYdiP0hNqIvOSvIQoz7zoH1kt1d8= system:mUX40QMM+dqZ0wQaHp7sH50UgiZnSXsInzc9/MvaZRc=
            fallback = true
            connect-timeout = 5
            download-attempts = 3

      - name: Override flake.lock
        if: inputs.flake_lock
        run: echo '${{ inputs.flake_lock }}' | base64 -d > flake.lock

      - name: Build and push to cache
        shell: nix develop --command bash -e {0}
        run: |
          set -euo pipefail

          echo "Building ${{ matrix.host }}..."
          nix build '.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel' \
            -o "result-${{ matrix.host }}"

          # niks3 authenticates with a GitHub OIDC token instead of a
          # long-lived secret. --auth-token-script is exec'd directly (shell
          # words are split, but no shell runs), so the file must be
          # executable and carry a shebang, and it must print exactly
          # {"token": "..."} on stdout — logs may go to stderr. Omitting
          # expires_at just means niks3 re-runs it per request, which is what
          # we want for a token this short-lived.
          #
          # The audience must match services.niks3.oidc.providers.github.audience
          # on basestar, and is URL-encoded because it is a query parameter.
          cat > /tmp/niks3-token.sh <<'TOKEN_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fniks3.arsfeld.dev" \
            | jq -c '{token: .value}'
          TOKEN_SCRIPT
          chmod +x /tmp/niks3-token.sh

          echo "Pushing to niks3..."

          # Upstream ships Mic92/niks3-action@v1, which auto-configures the
          # substituter and a post-build hook. It is deliberately NOT used:
          # its uploads are asynchronous with a post-step drain, and whether a
          # failed upload fails the job is undocumented. This step therefore
          # keeps the exact shape the attic push had — an explicit command, a
          # four-attempt retry, a hard ::error:: exit — because that shape is
          # what the tier-1 gate below depends on.
          #
          # Retry transient push failures, but never swallow them. "push
          # failed => job failed => weekly-deploy's tier-1 gate skips this
          # commit" is exactly what stops galactica from deploying a closure
          # that is not substitutable, and it deploys under `max-jobs = 0`,
          # where a cache miss is a hard failure rather than a local rebuild.
          # `|| true` or continue-on-error here would turn a clean skip into a
          # broken deploy.
          #
          # --pin exempts this closure from the 30-day GC window; pushing again
          # under the same name retargets the pin and lets the previous closure
          # age out normally. Dropping it would leave weekly-deploy able to
          # fail on a closure that aged out from under it.
          pushed=0
          for attempt in 1 2 3 4; do
            if niks3 push \
                 --server-url https://niks3.arsfeld.dev \
                 --auth-token-script /tmp/niks3-token.sh \
                 --pin "${{ matrix.host }}" \
                 "./result-${{ matrix.host }}"; then
              pushed=1
              break
            fi
            echo "niks3 push attempt $attempt failed"
            # `[ ... ] && sleep` would be the loop body's last command, and a
            # false test there trips `set -e`. Use an explicit if.
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::niks3 push failed after 4 attempts for ${{ matrix.host }}" >&2
            exit 1
          fi

          echo "Done: ${{ matrix.host }} built and cached"
